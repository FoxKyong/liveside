# Liveside in Japanese, translated by a machine.
#
# A translation is a copy of en.toml with the text in quotes changed:
# keep every key and every {placeholder}, which Liveside fills in, and
# change nothing outside the quotes. Lines starting with # are notes for
# the translator. A missing line is shown in English.

[language]
# The language's name in itself, as it is listed where it is chosen.
name = "日本語"
# Whether the text was translated by a machine and nobody has checked
# it yet; the language is then marked so where it is chosen.
machine = true
# A machine translation also says what to call it, in the language
# itself, as it is written beside the name where it is chosen:
note = "機械翻訳"
# A language written right to left says so, and the window is laid out
# from the right:
# rtl = true

[ui]

# Header and status line.
status_buffer = "状態"
connected = "接続済み"
connecting = "接続中"
offline = "オフライン"
reconnecting = "再接続中 #{attempt}"
not_logged_in = "未ログイン"
# Beside the turning wheel that says the client is waiting for an
# answer from Twitch.
working = "Twitch の応答を待っています…"
# Said in the status buffer as the connection comes and goes.
conn_server = "{server} に接続しました"
conn_rejected = "拒否されました: {reason}"
conn_lost = "切断されました"
conn_trying = "接続中…"
conn_backend = "{backend} に接続しました"
conn_retry = "再接続中（{attempt} 回目）: {reason}"

# Chat area.
scrolled_back = " {lines} 行戻っています（Esc で戻る） "
