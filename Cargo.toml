[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.10.1"
edition = "2024"
rust-version = "1.98"
authors = ["Radim Vančo <radim.vanco@jifox.cz>"]
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
liveside-proto = { path = "crates/proto" }
liveside-twitch = { path = "crates/twitch" }
liveside-core = { path = "crates/core" }
liveside-client = { path = "crates/client" }

serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
reqwest = { version = "0.13.5", features = ["json", "form", "query"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
ratatui = "0.30.2"
jiff = "0.2.37"
url = "2.5.8"
regex = "1.13.1"
emojis = "0.9.0"
zbus = { version = "5.19.0", default-features = false, features = ["async-io", "blocking-api"] }
unicode-width = "0.2.2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time", "signal", "process"] }

# Line tables are enough for a backtrace with file and line; full debug
# information had grown target/ past 16 GB on the 46 GB development VM.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
